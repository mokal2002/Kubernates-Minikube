<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Dark Slate Canvas (n8n canvas tone) -->
    <radialGradient id="n8nCanvas" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#181b26" />
      <stop offset="60%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#08090d" />
    </radialGradient>

    <!-- Coral / Tangerine Core Gradient (n8n signature) -->
    <linearGradient id="n8nAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea4b71" />
      <stop offset="50%" stop-color="#ff6d5a" />
      <stop offset="100%" stop-color="#ff9066" />
    </linearGradient>

    <!-- Subtle Node Glow -->
    <radialGradient id="accentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea4b71" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ea4b71" stop-opacity="0" />
    </radialGradient>

    <!-- Crisp Dot Grid -->
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2d3345" opacity="0.65" />
    </pattern>

    <!-- Specular Rim Light -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .k8s-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; letter-spacing: -0.5px; fill: #ffffff; }
    .k8s-sub { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 13px; letter-spacing: 1.5px; fill: #8790a8; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .node-type { font-family: "JetBrains Mono", monospace; font-size: 10px; fill: #ff6d5a; font-weight: 600; }
  </style>

  <!-- Background Base -->
  <rect width="1196" height="416" x="2" y="2" rx="20" fill="url(#n8nCanvas)" stroke="#222738" stroke-width="1.5" />
  <rect width="1196" height="416" x="2" y="2" rx="20" fill="url(#dotGrid)" />

  <!-- Background Glow behind orchestrator -->
  <circle cx="600" cy="190" r="240" fill="url(#accentGlow)" />

  <!-- Node Connector Cables (Bezier Splines like n8n editor) -->
  <g fill="none" stroke-linecap="round">
    <!-- Active Wire 1: Minikube -> Master -->
    <path d="M 270 185 C 360 185, 390 185, 480 185" stroke="#333b52" stroke-width="3" />
    <path d="M 270 185 C 360 185, 390 185, 480 185" stroke="url(#n8nAccent)" stroke-width="2.5" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="2s" repeatCount="indefinite" />
    </path>

    <!-- Active Wire 2: Master -> Deployments -->
    <path d="M 720 185 C 810 185, 840 185, 930 185" stroke="#333b52" stroke-width="3" />
    <path d="M 720 185 C 810 185, 840 185, 930 185" stroke="url(#n8nAccent)" stroke-width="2.5" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="2s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Left Node Card: Minikube Node -->
  <g transform="translate(90, 135)">
    <rect width="180" height="96" rx="12" fill="#141722" stroke="#252b3d" stroke-width="1.5" />
    <rect width="180" height="96" rx="12" fill="url(#rimLight)" />
    <!-- Connector Port Output -->
    <circle cx="180" cy="50" r="5.5" fill="#ff6d5a" stroke="#141722" stroke-width="2" />
    
    <!-- Node Content -->
    <rect x="16" y="16" width="28" height="28" rx="7" fill="#202638" />
    <path d="M23 30 L27 22 L33 22 L37 30 Z" fill="none" stroke="#ff6d5a" stroke-width="2" stroke-linejoin="round" />
    <text x="54" y="27" class="node-title">Cluster Core</text>
    <text x="54" y="40" class="node-type">MINIKUBE</text>
    <text x="16" y="76" font-family="'JetBrains Mono', monospace" font-size="11" fill="#606984">driver: docker</text>
  </g>

  <!-- Center Hub: Kubernetes Main Controller -->
  <g transform="translate(480, 110)">
    <!-- Node Card Body -->
    <rect width="240" height="150" rx="16" fill="#161a26" stroke="#ea4b71" stroke-width="2" filter="url(#softGlow)" />
    <rect width="240" height="150" rx="16" fill="url(#rimLight)" />

    <!-- Connection Ports -->
    <circle cx="0" cy="75" r="6" fill="#ea4b71" stroke="#161a26" stroke-width="2" />
    <circle cx="240" cy="75" r="6" fill="#ff6d5a" stroke="#161a26" stroke-width="2" />

    <!-- Center Icon & Wheel -->
    <g transform="translate(120, 50)">
      <circle r="24" fill="#221e2d" stroke="url(#n8nAccent)" stroke-width="2" />
      <circle r="8" fill="url(#n8nAccent)" />
      <path d="M0 -8 V-20 M0 8 V20 M-8 0 H-20 M8 0 H20" stroke="#ff6d5a" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Node Labels -->
    <text x="120" y="98" text-anchor="middle" class="node-title" font-size="16">Kube Orchestrator</text>
    <text x="120" y="116" text-anchor="middle" class="node-type" font-size="11">CONTROL PLANE</text>
    <rect x="52" y="126" width="136" height="16" rx="8" fill="#231d2a" />
    <text x="120" y="138" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ff8d7a">READY • 3 WORKERS</text>
  </g>

  <!-- Right Node Card: Pods & Deployments -->
  <g transform="translate(930, 135)">
    <rect width="180" height="96" rx="12" fill="#141722" stroke="#252b3d" stroke-width="1.5" />
    <rect width="180" height="96" rx="12" fill="url(#rimLight)" />
    <!-- Connector Port Input -->
    <circle cx="0" cy="50" r="5.5" fill="#ea4b71" stroke="#141722" stroke-width="2" />
    
    <!-- Node Content -->
    <rect x="16" y="16" width="28" height="28" rx="7" fill="#202638" />
    <circle cx="30" cy="30" r="5" fill="#ff6d5a" />
    <text x="54" y="27" class="node-title">Workloads</text>
    <text x="54" y="40" class="node-type">DEPLOYMENT</text>
    <text x="16" y="76" font-family="'JetBrains Mono', monospace" font-size="11" fill="#606984">replicas: 3 running</text>
  </g>

  <!-- Bottom Brand Typography -->
  <text x="600" y="325" text-anchor="middle" class="k8s-title" font-size="34">Kubernetes &amp; Minikube</text>
  <text x="600" y="355" text-anchor="middle" class="k8s-sub">NODE-BASED WORKLOAD ORCHESTRATION HANDBOOK</text>

  <!-- Bottom Status Dot Pill -->
  <g transform="translate(525, 375)">
    <rect width="150" height="24" rx="12" fill="#1b202e" stroke="#2a3248" stroke-width="1" />
    <circle cx="15" cy="12" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="78" y="16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">LOCAL RUNTIME</text>
  </g>
</svg>
